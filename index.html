<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGrade - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-user-graduate"></i>
            </div>
            <h1>SMART<span>GRADE</span></h1>
        </div>

        <div class="welcome-text">
            <h2>Bem-vindo</h2>
            <p>Acesse sua conta de professor.</p>
        </div>

        <form>
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope"></i>
                    <input type="email" id="email" placeholder="nome@instituicao.edu">
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="password">Senha</label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Lembrar-me</label>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="divider">
            <span>ou continue com</span>
        </div>

        <div class="social-login">
            <button class="btn-social">
                <img src="https://img.icons8.com/color/48/000000/google-logo.png" alt="Google">
                Google
            </button>
            <button class="btn-social">
                <i class="fab fa-apple"></i>
                Apple
            </button>
        </div>

        <p class="signup-text">Não tem uma conta? <a href="#">Criar conta</a></p>

        <footer class="links-footer">
            <a href="#">Ajuda</a>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
        </footer>
    </div>

</body>
</html>
